<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Chart</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        #chart {
            width: 100%;
            height: 500px;
        }
        #controls {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <div id="controls">
        <button onclick="highlightPatterns()">Highlight Repeating Patterns</button>
        <p>Drag over candles to select a pattern.</p>
    </div>
    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            width: window.innerWidth * 0.9,
            height: 500,
            layout: {
                backgroundColor: '#ffffff',
                textColor: '#000000',
            },
            grid: {
                vertLines: { color: '#e1e1e1' },
                horzLines: { color: '#e1e1e1' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            priceScale: {
                borderColor: '#cccccc',
            },
            timeScale: {
                borderColor: '#cccccc',
            },
        });
        
        const candleSeries = chart.addCandlestickSeries();
        
        const data = [
            { time: '2007-11-27', open: 770, high: 1050, low: 770, close: 962.9 },
            { time: '2007-11-28', open: 984, high: 990, low: 874, close: 893.9 },
            { time: '2007-11-29', open: 909, high: 914.75, low: 841, close: 884.2 },
            { time: '2007-11-30', open: 890, high: 958, low: 890, close: 921.55 },
            { time: '2007-12-03', open: 939.75, high: 995, low: 922, close: 969.3 },
            { time: '2007-12-04', open: 985, high: 1056, low: 976, close: 1041.45 },
            { time: '2007-12-05', open: 1061, high: 1099.5, low: 1050, close: 1082.45 },
            { time: '2007-12-06', open: 1089, high: 1109.7, low: 1051, close: 1081.3 },
            { time: '2007-12-07', open: 1100, high: 1134, low: 1078, close: 1102.4 },
            { time: '2007-12-10', open: 1110, high: 1110, low: 1061.1, close: 1075.4 },
        ];
        
        candleSeries.setData(data);

        let selectedCandles = [];
        let isDragging = false;

        chart.subscribeCrosshairMove(param => {
            if (!param || !param.time) return;
            if (param.seriesData.has(candleSeries) && isDragging) {
                const candle = param.seriesData.get(candleSeries);
                if (!selectedCandles.some(c => c.time === candle.time)) {
                    selectedCandles.push(candle);
                }
            }
        });

        chart.subscribeClick(() => {
            isDragging = !isDragging;
            if (!isDragging) console.log('Selection finished:', selectedCandles);
        });

        function highlightPatterns() {
            let foundPatterns = [];
            let selectedPattern = JSON.stringify(selectedCandles);
            
            for (let i = 0; i < data.length - selectedCandles.length; i++) {
                let pattern = JSON.stringify(data.slice(i, i + selectedCandles.length));
                if (pattern === selectedPattern) {
                    foundPatterns.push({ start: i, end: i + selectedCandles.length - 1 });
                }
            }
            
            foundPatterns.forEach(({ start, end }) => {
                chart.addRectangle({
                    price1: data[start].high,
                    price2: data[end].low,
                    time1: data[start].time,
                    time2: data[end].time,
                    color: 'rgba(0, 0, 255, 0.2)',
                    borderColor: 'blue',
                    borderWidth: 2,
                });
            });
        }

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: window.innerWidth * 0.9 });
        });
    </script>
</body>
</html>
